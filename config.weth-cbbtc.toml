# Use with: CONFIG_FILE=config.weth-cbbtc.toml
#
# Venue 0 (UniV2 0x4fe4A5f5...) is nearly empty (~0.5 WETH / 0.016 cbBTC
# reserves); it almost never wins but costs a quote per scan. Drop it if you
# only care about the deep pools below.
#
# Aerodrome migrated CL to a SECOND factory (0xf8f2eB49...) beside the legacy
# one (0x5e7BB104...). Both mint pools for the same pair at the same
# tickSpacing, so a venue pointing at one factory MUST use that factory's
# router (0x698Cb2b6...) and quoter (0x514c8B5f...). Startup verifies the
# quoter↔factory pairing and refuses to run on a mismatch.

